[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prng-lattice-lab"
version = "0.5.0"
description = "A closed harness for characterising the recoverability boundary of java.util.Random under partial-state leakage. Anchored on Randar; folds into repoauditor as a weak_rng_adapter."
license = { file = "LICENSE" }
authors = [{ name = "erxxc" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# lattice reduction + enumeration for the rest of the sweep (round-off path needs neither).
# cysignals is a runtime import of fpylll that its wheels do not always pull in.
lattice = ["fpylll>=0.6", "cysignals>=1.11"]
# full json-schema validation (store/db falls back to required-field checks without it)
schema = ["jsonschema>=4.0"]
# optional LLM prose pass for `report --narrate` (deterministic report needs none of this;
# absence is disclosed as a capability gap, never faked).
narrative = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/erxxc/prng-lattice-lab"
Repository = "https://github.com/erxxc/prng-lattice-lab"
"Fold-in target (RepoAuditor)" = "https://github.com/erxxc/repoauditor"

[project.scripts]
prng-lattice-lab = "prng_lattice_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
