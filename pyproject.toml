[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prng-lattice-lab"
version = "0.1.0"
description = "A closed harness for characterising the recoverability boundary of java.util.Random under partial-state leakage. Anchored on Randar; folds into repoauditor as a weak_rng_adapter."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# lattice reduction for the starved-leak cells of the sweep (round-off path needs neither)
lattice = ["fpylll>=0.6"]
# full json-schema validation (store/db falls back to required-field checks without it)
schema = ["jsonschema>=4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
prng-lattice-lab = "prng_lattice_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
